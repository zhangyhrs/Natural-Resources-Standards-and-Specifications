<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>自然资源法律法规检索</title>
<style>
:root{--ink:#1f2d3d;--muted:#6d7b88;--line:#e2e8ef;--bg:#f7f9fc;--panel:#fff;--navy:#163a5f;--teal:#197d7a;--mint:#e9f5f3;--hot:#c45a16;--hotbg:#fff3e8;--hotline:#f0c49f}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--ink)}a{color:inherit}
.hero{background:linear-gradient(135deg,#173b5e,#1e6f72);color:#fff;padding:24px 0 20px}.shell{width:calc(100% - 120px);max-width:1380px;margin-left:auto;margin-right:auto}.eyebrow{font-size:12px;opacity:.82;letter-spacing:.06em}.hero h1{font-size:28px;margin:6px 0}.hero p{margin:0;font-size:14px;opacity:.88}.nav{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}.nav a{font-size:13px;text-decoration:none;border:1px solid rgba(255,255,255,.28);padding:6px 10px;border-radius:999px}.nav a.active{background:#fff;color:var(--navy)}
.wrap{margin-top:16px}.search-panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 5px 16px rgba(31,45,61,.045)}.searchbox{display:flex;gap:8px}.searchbox input{flex:1;height:42px;border:1px solid #cfd8e3;border-radius:9px;padding:0 13px;font-size:14px;outline:none}.searchbox input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(25,125,122,.1)}.searchbox button{border:0;background:var(--teal);color:#fff;padding:0 20px;border-radius:9px;font-size:14px;cursor:pointer}.filters{margin-top:10px}.filter{display:grid;grid-template-columns:102px 1fr;gap:8px;padding:8px 0;border-top:1px solid #edf1f5}.filter:first-child{border-top:0}.filter-label{font-weight:700;color:#445363;font-size:13px;padding-top:5px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid transparent;background:#f4f7fa;color:#425263;border-radius:999px;padding:5px 10px;cursor:pointer;font-size:12.5px}.chip:hover{border-color:#bedbd7}.chip.active{background:var(--mint);color:#0e6663;border-color:#9bd0ca;font-weight:700}.chip.hot-chip.active{background:var(--hotbg);color:var(--hot);border-color:var(--hotline)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0 8px}.count{font-size:13px;color:var(--muted)}.toolbar-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}.sort-group{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted)}.sort-btn{border:1px solid #d5dde6;background:#fff;color:#536171;border-radius:7px;padding:6px 9px;cursor:pointer;font-size:12.5px}.sort-btn:hover{border-color:#b7c5d3}.sort-btn.active{background:var(--navy);border-color:var(--navy);color:#fff}.reset{border:1px solid #cfd8e3;background:#fff;border-radius:7px;padding:6px 10px;cursor:pointer;color:#536171;font-size:13px}.table-card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1260px}th,td{padding:10px 9px;border-bottom:1px solid #edf1f5;text-align:left;font-size:13.5px}th{background:#f3f7fa;color:#425263;font-weight:700;white-space:nowrap}tbody tr:hover{background:#fbfdfd}.title{min-width:285px}.title-line{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#f2f4f7;color:#566474;font-size:12px;white-space:nowrap}.hot-badge{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;background:var(--hotbg);border:1px solid var(--hotline);color:var(--hot);font-size:10.5px;font-weight:800;letter-spacing:.03em;white-space:nowrap}.downloads{font-variant-numeric:tabular-nums;white-space:nowrap;color:#536171}.downloads.hot{color:var(--hot);font-weight:700}.download-btn{display:inline-block;padding:5px 10px;border-radius:7px;background:var(--teal);color:#fff;text-decoration:none;font-size:12.5px;font-weight:700;white-space:nowrap}.download-btn:hover{background:#126865}.empty{text-align:center;color:#7b8794;padding:40px}.pagination{display:flex;justify-content:center;gap:5px;padding:12px}.pagination button{min-width:32px;height:32px;border:1px solid #d5dde6;background:#fff;border-radius:7px;cursor:pointer}.pagination button.active{background:var(--navy);color:#fff;border-color:var(--navy)}.note{font-size:12px;color:#7d8894;line-height:1.65;margin-top:9px}.footer{text-align:center;color:#8a96a3;font-size:12px;padding:18px}
@media(max-width:1100px){.shell{width:calc(100% - 56px)}}@media(max-width:760px){.shell{width:calc(100% - 24px)}.hero{padding:20px 0 17px}.hero h1{font-size:23px}.filter{grid-template-columns:1fr}.searchbox{display:grid;grid-template-columns:1fr}.searchbox button{height:40px}.toolbar{align-items:flex-start;flex-direction:column}.toolbar-actions{justify-content:flex-start}}
</style>
</head>
<body>
<header class="hero"><div class="shell"><div class="eyebrow">自然资源标准规范与法律法规库</div><h1>自然资源法律法规检索</h1><p>按法律效力层级、业务领域或地区、发布机关及关键词快速筛选。</p><div class="nav"><a href="./">技术标准检索</a><a class="active" href="./laws.html">法律法规检索</a><a href="https://github.com/zhangyhrs/Natural-Resources-Standards-and-Specifications" target="_blank" rel="noopener">GitHub 仓库</a></div></div></header>
<main class="shell wrap"><section class="search-panel"><div class="searchbox"><input id="q" placeholder="输入法规名称、发布机关或关键词，如：土地管理法、不动产登记、自然资源部"><button id="searchBtn">查询</button></div><div class="filters"><div class="filter"><div class="filter-label">效力层级</div><div class="chips" id="levelOpts"></div></div><div class="filter"><div class="filter-label">业务领域或地区</div><div class="chips" id="domainOpts"></div></div><div class="filter"><div class="filter-label">发布机关</div><div class="chips" id="issuerOpts"></div></div><div class="filter"><div class="filter-label">热门资料</div><div class="chips" id="hotOpts"></div></div></div></section><div class="toolbar"><div class="count" id="count">正在读取法律法规数据……</div><div class="toolbar-actions"><div class="sort-group"><span>排序：</span><button class="sort-btn active" data-sort="default">默认</button><button class="sort-btn" data-sort="hot">热门</button><button class="sort-btn" data-sort="latest">最新</button></div><button class="reset" id="resetBtn">清除筛选</button></div></div><section class="table-card"><div class="table-wrap"><table><thead><tr><th>序号</th><th>名称</th><th>效力层级</th><th>业务领域或地区</th><th>日期</th><th>发布机关</th><th>标签</th><th>下载量</th><th>文档</th></tr></thead><tbody id="tbody"></tbody></table></div><div class="pagination" id="pager"></div></section><div class="note">说明：本页面数据来自仓库维护的法律法规索引。日期、发布机关和分类信息用于检索辅助，具体法律效力、现行状态及适用范围以官方最新发布文本为准。下载量为本站下载按钮的累计点击统计，仅供资料热度参考；全库累计下载量前 5 名自动标记 HOT。</div></main><div class="footer">自然资源标准规范与法律法规库 · 持续更新</div>
<script>
const PAGE_SIZE=25;
const COUNTER_NS='zhangyhrs-natural-resources-library';
const COUNTER_ACTION='law-download';
const COUNTER_BASE='https://counterapi.com/api';
let all=[],filtered=[],page=1,sortMode='default';
const state={level:'全部',domain:'全部',issuer:'全部',hot:'全部'};
const $=id=>document.getElementById(id);

function uniq(field){return [...new Set(all.map(x=>x[field]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-CN'));}
function renderOptions(id,field,values,extraClass=''){const el=$(id);el.innerHTML='';['全部',...values].forEach(v=>{const b=document.createElement('button');b.className='chip '+extraClass+(state[field]===v?' active':'');b.textContent=v;b.onclick=()=>{state[field]=v;page=1;apply();renderAllOptions();};el.appendChild(b);});}
function renderAllOptions(){renderOptions('levelOpts','level',uniq('效力层级'));let domains=uniq('业务领域或地区');if(state.level!=='全部')domains=[...new Set(all.filter(x=>x['效力层级']===state.level).map(x=>x['业务领域或地区']).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-CN'));if(state.domain!=='全部'&&!domains.includes(state.domain))state.domain='全部';renderOptions('domainOpts','domain',domains);renderOptions('issuerOpts','issuer',uniq('发布机关'));renderOptions('hotOpts','hot',['HOT 热门'],'hot-chip');}
function norm(s){return(s||'').toLowerCase().replace(/\s+/g,'');}
function counterKey(x){const raw=(x['下载']||x['链接']||x['名称']||'').toLowerCase();let h=2166136261;for(let i=0;i<raw.length;i++){h^=raw.charCodeAt(i);h=Math.imul(h,16777619);}return 'law-'+(h>>>0).toString(16);}
function counterUrl(x,readOnly=false){return `${COUNTER_BASE}/${encodeURIComponent(COUNTER_NS)}/${encodeURIComponent(COUNTER_ACTION)}/${encodeURIComponent(counterKey(x))}${readOnly?'?readOnly=true':''}`;}
function dateValue(x){const s=(x['日期']||'').trim();const m=s.match(/(19|20)\d{2}(?:[-./年](\d{1,2}))?(?:[-./月](\d{1,2}))?/);if(!m)return 0;const y=Number(m[0].slice(0,4)),mo=Number(m[2]||1),d=Number(m[3]||1);return new Date(y,mo-1,d).getTime()||0;}
function recomputeHot(){all.forEach(x=>x._hot=false);const ranked=all.filter(x=>Number(x._downloads)>0).sort((a,b)=>(b._downloads||0)-(a._downloads||0));if(!ranked.length)return;const fifth=ranked[Math.min(4,ranked.length-1)]?._downloads||0;ranked.forEach((x,i)=>{if(i<5||(fifth>0&&x._downloads===fifth))x._hot=true;});}
function sortRows(rows){const copy=[...rows];if(sortMode==='hot')copy.sort((a,b)=>(b._downloads||0)-(a._downloads||0)||a._order-b._order);else if(sortMode==='latest')copy.sort((a,b)=>dateValue(b)-dateValue(a)||a._order-b._order);else copy.sort((a,b)=>a._order-b._order);return copy;}
function apply(){const q=norm($('q').value);let rows=all.filter(x=>{const text=norm([x['名称'],x['效力层级'],x['业务领域或地区'],x['日期'],x['发布机关'],x['标签']].join(' '));return(!q||text.includes(q))&&(state.level==='全部'||x['效力层级']===state.level)&&(state.domain==='全部'||x['业务领域或地区']===state.domain)&&(state.issuer==='全部'||x['发布机关']===state.issuer)&&(state.hot==='全部'||x._hot);});filtered=sortRows(rows);page=Math.min(page,Math.max(1,Math.ceil(filtered.length/PAGE_SIZE)));renderTable();renderPager();}
function renderTable(){$('count').textContent=`共收录 ${all.length} 项，当前筛选 ${filtered.length} 项`;const body=$('tbody');body.innerHTML='';const start=(page-1)*PAGE_SIZE,rows=filtered.slice(start,start+PAGE_SIZE);if(!rows.length){body.innerHTML='<tr><td colspan="9" class="empty">没有找到符合条件的法律法规</td></tr>';return;}rows.forEach((x,i)=>{const tr=document.createElement('tr');const hot=x._hot?'<span class="hot-badge">HOT</span>':'';const count=x._downloads==null?'—':`${x._downloads} 次`;tr.innerHTML=`<td>${start+i+1}</td><td class="title"><div class="title-line"><span>${x['名称']}</span>${hot}</div></td><td><span class="badge">${x['效力层级']}</span></td><td>${x['业务领域或地区']}</td><td>${x['日期']||'-'}</td><td>${x['发布机关']||'-'}</td><td>${x['标签']||'-'}</td><td class="downloads${x._hot?' hot':''}">${count}</td><td><a class="download-btn" href="${x['下载']||x['链接']}" data-key="${counterKey(x)}" download>下载文档</a></td>`;const a=tr.querySelector('.download-btn');a.addEventListener('click',()=>recordDownload(x));body.appendChild(tr);});}
function renderPager(){const pages=Math.ceil(filtered.length/PAGE_SIZE),el=$('pager');el.innerHTML='';if(pages<=1)return;const add=(txt,p,active=false)=>{const b=document.createElement('button');b.textContent=txt;b.className=active?'active':'';b.disabled=p<1||p>pages;b.onclick=()=>{page=p;renderTable();renderPager();window.scrollTo({top:0,behavior:'smooth'});};el.appendChild(b);};add('‹',page-1);const s=Math.max(1,page-2),e=Math.min(pages,page+2);for(let p=s;p<=e;p++)add(p,p,p===page);add('›',page+1);}
function reset(){state.level=state.domain=state.issuer=state.hot='全部';sortMode='default';$('q').value='';page=1;document.querySelectorAll('.sort-btn').forEach(b=>b.classList.toggle('active',b.dataset.sort==='default'));renderAllOptions();apply();}
async function readCount(x){try{const r=await fetch(counterUrl(x,true),{cache:'no-store'});if(!r.ok)throw new Error('counter');const data=await r.json();x._downloads=Number(data.value)||0;}catch(e){x._downloads=0;}}
function loadCounts(){Promise.allSettled(all.map(readCount)).then(()=>{recomputeHot();renderAllOptions();apply();});}
function recordDownload(x){try{fetch(counterUrl(x,false),{cache:'no-store',keepalive:true}).then(r=>r.ok?r.json():null).then(data=>{if(data&&Number.isFinite(Number(data.value))){x._downloads=Number(data.value);recomputeHot();renderAllOptions();apply();}}).catch(()=>{});}catch(e){}}

$('searchBtn').onclick=()=>{page=1;apply();};$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){page=1;apply();}});$('q').addEventListener('input',()=>{page=1;apply();});$('resetBtn').onclick=reset;
document.querySelectorAll('.sort-btn').forEach(b=>b.onclick=()=>{sortMode=b.dataset.sort;page=1;document.querySelectorAll('.sort-btn').forEach(x=>x.classList.toggle('active',x===b));apply();});
fetch('./laws.json?v='+Date.now()).then(r=>{if(!r.ok)throw new Error('数据文件不存在');return r.json();}).then(data=>{all=data.map((x,i)=>({...x,_order:i,_downloads:null,_hot:false}));filtered=[...all];renderAllOptions();apply();loadCounts();}).catch(err=>{$('count').textContent='法律法规数据加载失败：'+err.message;$('tbody').innerHTML='<tr><td colspan="9" class="empty">请稍后刷新页面。</td></tr>';});
</script>
</body></html>
