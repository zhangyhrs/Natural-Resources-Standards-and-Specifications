name: Deploy searchable library pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '标准规范/**'
      - '法律法规/**'
      - '法律法规索引.md'
      - 'scripts/build_inventory.py'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build search data
        run: python scripts/build_inventory.py

      - name: Add cache-busting to search data requests
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          sha = os.environ.get('GITHUB_SHA', 'latest')[:12]
          for file_name, data_name in [('index.html', 'standards.json'), ('laws.html', 'laws.json')]:
              p = Path('docs') / file_name
              text = p.read_text(encoding='utf-8')
              text = text.replace(
                  f"fetch('./{data_name}')",
                  f"fetch('./{data_name}?v={sha}', {{cache:'no-store'}})"
              )
              p.write_text(text, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
