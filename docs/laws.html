<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>自然资源法律法规检索</title>
<style>
:root{--ink:#1f2d3d;--muted:#6d7b88;--line:#e2e8ef;--bg:#f7f9fc;--panel:#fff;--navy:#163a5f;--teal:#197d7a;--mint:#e9f5f3}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--ink)}
a{color:inherit}.hero{background:linear-gradient(135deg,#173b5e,#1e6f72);color:#fff;padding:34px 20px 28px}.hero-inner,.nav,.wrap{max-width:1460px;margin-left:auto;margin-right:auto}.eyebrow{font-size:13px;opacity:.82;letter-spacing:.08em}.hero h1{font-size:30px;margin:8px 0 8px}.hero p{margin:0;opacity:.88}.nav{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}.nav a{font-size:13px;text-decoration:none;border:1px solid rgba(255,255,255,.28);padding:7px 11px;border-radius:999px}.nav a.active{background:#fff;color:var(--navy)}
.wrap{margin-top:22px;padding:0 12px}.search-panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 8px 24px rgba(31,45,61,.05)}.searchbox{display:flex;gap:10px}.searchbox input{flex:1;height:46px;border:1px solid #cfd8e3;border-radius:10px;padding:0 14px;font-size:15px;outline:none}.searchbox input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(25,125,122,.1)}.searchbox button{border:0;background:var(--teal);color:#fff;padding:0 22px;border-radius:10px;font-size:15px;cursor:pointer}.filters{margin-top:14px}.filter{display:grid;grid-template-columns:112px 1fr;gap:10px;padding:11px 0;border-top:1px solid #edf1f5}.filter:first-child{border-top:0}.filter-label{font-weight:700;color:#445363;font-size:14px;padding-top:6px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid transparent;background:#f4f7fa;color:#425263;border-radius:999px;padding:6px 11px;cursor:pointer;font-size:13px}.chip:hover{border-color:#bedbd7}.chip.active{background:var(--mint);color:#0e6663;border-color:#9bd0ca;font-weight:700}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}.count{font-size:14px;color:var(--muted)}.reset{border:1px solid #cfd8e3;background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;color:#536171}.table-card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1180px}th,td{padding:12px 11px;border-bottom:1px solid #edf1f5;text-align:left;font-size:14px}th{background:#f3f7fa;color:#425263;font-weight:700;white-space:nowrap}tbody tr:hover{background:#fbfdfd}.title{min-width:300px}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#f2f4f7;color:#566474;font-size:12px;white-space:nowrap}.download-btn{display:inline-block;padding:6px 12px;border-radius:8px;background:var(--teal);color:#fff;text-decoration:none;font-size:13px;font-weight:700;white-space:nowrap}.download-btn:hover{background:#126865}.empty{text-align:center;color:#7b8794;padding:48px}.pagination{display:flex;justify-content:center;gap:6px;padding:16px}.pagination button{min-width:34px;height:34px;border:1px solid #d5dde6;background:#fff;border-radius:8px;cursor:pointer}.pagination button.active{background:var(--navy);color:#fff;border-color:var(--navy)}.note{font-size:12px;color:#7d8894;line-height:1.7;margin-top:12px}.footer{text-align:center;color:#8a96a3;font-size:12px;padding:26px}
@media(max-width:760px){.hero h1{font-size:24px}.filter{grid-template-columns:1fr}.searchbox{display:grid;grid-template-columns:1fr}.searchbox button{height:44px}}
</style>
</head>
<body>
<header class="hero"><div class="hero-inner"><div class="eyebrow">Laws & Regulations Library</div><h1>自然资源法律法规检索</h1><p>按法律效力层级、业务领域或地区、发布机关及关键词快速筛选。</p><div class="nav"><a href="./">标准检索</a><a class="active" href="./laws.html">法律法规检索</a><a href="../">GitHub 仓库</a><a href="../法律法规索引.md">法律法规目录</a></div></div></header>
<main class="wrap"><section class="search-panel"><div class="searchbox"><input id="q" placeholder="输入法规名称、发布机关或关键词，如：土地管理法、不动产登记、自然资源部"><button id="searchBtn">查询</button></div><div class="filters"><div class="filter"><div class="filter-label">效力层级</div><div class="chips" id="levelOpts"></div></div><div class="filter"><div class="filter-label">业务领域或地区</div><div class="chips" id="domainOpts"></div></div><div class="filter"><div class="filter-label">发布机关</div><div class="chips" id="issuerOpts"></div></div></div></section><div class="toolbar"><div class="count" id="count">正在读取法律法规数据……</div><button class="reset" id="resetBtn">清除筛选</button></div><section class="table-card"><div class="table-wrap"><table><thead><tr><th>序号</th><th>名称</th><th>效力层级</th><th>业务领域或地区</th><th>日期</th><th>发布机关</th><th>标签</th><th>下载</th></tr></thead><tbody id="tbody"></tbody></table></div><div class="pagination" id="pager"></div></section><div class="note">说明：本页面数据来自仓库维护的法律法规索引。日期、发布机关和分类信息用于检索辅助，具体法律效力、现行状态及适用范围以官方最新发布文本为准。</div></main><div class="footer">自然资源技术标准规范库 · 持续更新</div>
<script>
const PAGE_SIZE=25;let all=[],filtered=[],page=1;const state={level:'全部',domain:'全部',issuer:'全部'};const $=id=>document.getElementById(id);
function uniq(field){return [...new Set(all.map(x=>x[field]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-CN'));}
function renderOptions(id,field,values){const el=$(id);el.innerHTML='';['全部',...values].forEach(v=>{const b=document.createElement('button');b.className='chip'+(state[field]===v?' active':'');b.textContent=v;b.onclick=()=>{state[field]=v;page=1;apply();renderAllOptions();};el.appendChild(b);});}
function renderAllOptions(){renderOptions('levelOpts','level',uniq('效力层级'));let domains=uniq('业务领域或地区');if(state.level!=='全部')domains=[...new Set(all.filter(x=>x['效力层级']===state.level).map(x=>x['业务领域或地区']).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-CN'));if(state.domain!=='全部'&&!domains.includes(state.domain))state.domain='全部';renderOptions('domainOpts','domain',domains);renderOptions('issuerOpts','issuer',uniq('发布机关'));}
function norm(s){return(s||'').toLowerCase().replace(/\s+/g,'');}
function apply(){const q=norm($('q').value);filtered=all.filter(x=>{const text=norm([x['名称'],x['效力层级'],x['业务领域或地区'],x['日期'],x['发布机关'],x['标签']].join(' '));return(!q||text.includes(q))&&(state.level==='全部'||x['效力层级']===state.level)&&(state.domain==='全部'||x['业务领域或地区']===state.domain)&&(state.issuer==='全部'||x['发布机关']===state.issuer);});page=Math.min(page,Math.max(1,Math.ceil(filtered.length/PAGE_SIZE)));renderTable();renderPager();}
function renderTable(){$('count').textContent=`共收录 ${all.length} 项，当前筛选 ${filtered.length} 项`;const body=$('tbody');body.innerHTML='';const start=(page-1)*PAGE_SIZE,rows=filtered.slice(start,start+PAGE_SIZE);if(!rows.length){body.innerHTML='<tr><td colspan="8" class="empty">没有找到符合条件的法律法规</td></tr>';return;}rows.forEach((x,i)=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${start+i+1}</td><td class="title">${x['名称']}</td><td><span class="badge">${x['效力层级']}</span></td><td>${x['业务领域或地区']}</td><td>${x['日期']||'-'}</td><td>${x['发布机关']||'-'}</td><td>${x['标签']||'-'}</td><td><a class="download-btn" href="${x['下载']||x['链接']}" download>下载</a></td>`;body.appendChild(tr);});}
function renderPager(){const pages=Math.ceil(filtered.length/PAGE_SIZE),el=$('pager');el.innerHTML='';if(pages<=1)return;const add=(txt,p,active=false)=>{const b=document.createElement('button');b.textContent=txt;b.className=active?'active':'';b.disabled=p<1||p>pages;b.onclick=()=>{page=p;renderTable();renderPager();window.scrollTo({top:0,behavior:'smooth'});};el.appendChild(b);};add('‹',page-1);const s=Math.max(1,page-2),e=Math.min(pages,page+2);for(let p=s;p<=e;p++)add(p,p,p===page);add('›',page+1);}
function reset(){state.level=state.domain=state.issuer='全部';$('q').value='';page=1;renderAllOptions();apply();}
$('searchBtn').onclick=()=>{page=1;apply();};$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){page=1;apply();}});$('q').addEventListener('input',()=>{page=1;apply();});$('resetBtn').onclick=reset;
fetch('./laws.json').then(r=>{if(!r.ok)throw new Error('数据文件不存在');return r.json();}).then(data=>{all=data;filtered=data;renderAllOptions();apply();}).catch(err=>{$('count').textContent='法律法规数据加载失败：'+err.message;$('tbody').innerHTML='<tr><td colspan="8" class="empty">请稍后刷新页面。</td></tr>';});
</script>
</body></html>
