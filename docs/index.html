<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>自然资源技术标准检索</title>
<style>
:root{--ink:#1f2d3d;--muted:#6d7b88;--line:#e2e8ef;--bg:#f7f9fc;--panel:#fff;--navy:#163a5f;--teal:#197d7a;--mint:#e9f5f3}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--ink)}a{color:inherit}
.hero{background:linear-gradient(135deg,#173b5e,#1e6f72);color:#fff;padding:24px 0 20px}.shell{width:calc(100% - 120px);max-width:1380px;margin-left:auto;margin-right:auto}.eyebrow{font-size:12px;opacity:.82;letter-spacing:.06em}.hero h1{font-size:28px;margin:6px 0}.hero p{margin:0;font-size:14px;opacity:.88}.nav{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}.nav a{font-size:13px;text-decoration:none;border:1px solid rgba(255,255,255,.28);padding:6px 10px;border-radius:999px}.nav a.active{background:#fff;color:var(--navy)}
.wrap{margin-top:16px}.search-panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 5px 16px rgba(31,45,61,.045)}.searchbox{display:flex;gap:8px}.searchbox input{flex:1;height:42px;border:1px solid #cfd8e3;border-radius:9px;padding:0 13px;font-size:14px;outline:none}.searchbox input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(25,125,122,.1)}.searchbox button{border:0;background:var(--teal);color:#fff;padding:0 20px;border-radius:9px;font-size:14px;cursor:pointer}.filters{margin-top:10px}.filter{display:grid;grid-template-columns:102px 1fr;gap:8px;padding:8px 0;border-top:1px solid #edf1f5}.filter:first-child{border-top:0}.filter-label{font-weight:700;color:#445363;font-size:13px;padding-top:5px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid transparent;background:#f4f7fa;color:#425263;border-radius:999px;padding:5px 10px;cursor:pointer;font-size:12.5px}.chip:hover{border-color:#bedbd7}.chip.active{background:var(--mint);color:#0e6663;border-color:#9bd0ca;font-weight:700}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:12px 0 8px}.count{font-size:13px;color:var(--muted)}.reset{border:1px solid #cfd8e3;background:#fff;border-radius:7px;padding:6px 10px;cursor:pointer;color:#536171;font-size:13px}.table-card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1180px}th,td{padding:10px 9px;border-bottom:1px solid #edf1f5;text-align:left;font-size:13.5px}th{background:#f3f7fa;color:#425263;font-weight:700;white-space:nowrap}tbody tr:hover{background:#fbfdfd}.stdno{font-weight:700;color:#173b5e;white-space:nowrap}.title{min-width:240px}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#f2f4f7;color:#566474;font-size:12px;white-space:nowrap}.download-btn{display:inline-block;padding:5px 10px;border-radius:7px;background:var(--teal);color:#fff;text-decoration:none;font-size:12.5px;font-weight:700;white-space:nowrap}.download-btn:hover{background:#126865}.empty{text-align:center;color:#7b8794;padding:40px}.pagination{display:flex;justify-content:center;gap:5px;padding:12px}.pagination button{min-width:32px;height:32px;border:1px solid #d5dde6;background:#fff;border-radius:7px;cursor:pointer}.pagination button.active{background:var(--navy);color:#fff;border-color:var(--navy)}.note{font-size:12px;color:#7d8894;line-height:1.6;margin-top:9px}.footer{text-align:center;color:#8a96a3;font-size:12px;padding:18px}
@media(max-width:1100px){.shell{width:calc(100% - 56px)}}@media(max-width:760px){.shell{width:calc(100% - 24px)}.hero{padding:20px 0 17px}.hero h1{font-size:23px}.filter{grid-template-columns:1fr}.searchbox{display:grid;grid-template-columns:1fr}.searchbox button{height:40px}}
</style>
</head>
<body>
<header class="hero"><div class="shell"><div class="eyebrow">自然资源标准规范与法律法规库</div><h1>自然资源技术标准检索</h1><p>按标准号、名称、标准体系和专业方向快速筛选仓库已收录标准。</p><div class="nav"><a class="active" href="./">技术标准检索</a><a href="./laws.html">法律法规检索</a><a href="https://github.com/zhangyhrs/Natural-Resources-Standards-and-Specifications" target="_blank" rel="noopener">GitHub 仓库</a></div></div></header>
<main class="shell wrap"><section class="search-panel"><div class="searchbox"><input id="q" placeholder="输入标准名称、标准号或关键词，如：18314、地籍调查、GNSS"><button id="searchBtn">查询</button></div><div class="filters"><div class="filter"><div class="filter-label">标准层级</div><div class="chips" id="levelOpts"></div></div><div class="filter"><div class="filter-label">标准性质</div><div class="chips" id="natureOpts"></div></div><div class="filter"><div class="filter-label">标准体系</div><div class="chips" id="systemOpts"></div></div><div class="filter"><div class="filter-label">专业分类</div><div class="chips" id="domainOpts"></div></div></div></section><div class="toolbar"><div class="count" id="count">正在读取标准数据……</div><button class="reset" id="resetBtn">清除筛选</button></div><section class="table-card"><div class="table-wrap"><table><thead><tr><th>序号</th><th>标准号</th><th>标准名称</th><th>层级</th><th>性质</th><th>标准体系</th><th>专业分类</th><th>年份</th><th>文档</th></tr></thead><tbody id="tbody"></tbody></table></div><div class="pagination" id="pager"></div></section><div class="note">说明：检索数据由仓库目录自动生成，仅反映当前已收录资料。标准状态、发布日期、实施日期等信息后续逐步补充，最终以官方发布信息为准。</div></main><div class="footer">自然资源标准规范与法律法规库 · 持续更新</div>
<script>
const PAGE_SIZE=25;let all=[],filtered=[],page=1;const state={level:'全部',nature:'全部',system:'全部',domain:'全部'};const $=id=>document.getElementById(id);
function uniq(field){return [...new Set(all.map(x=>x[field]).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-CN'));}
function renderOptions(id,field,values){const el=$(id);el.innerHTML='';['全部',...values].forEach(v=>{const b=document.createElement('button');b.className='chip'+(state[field]===v?' active':'');b.textContent=v;b.onclick=()=>{state[field]=v;page=1;renderAllOptions();apply();};el.appendChild(b);});}
function renderAllOptions(){renderOptions('levelOpts','level',uniq('标准层级'));renderOptions('natureOpts','nature',uniq('标准性质'));renderOptions('systemOpts','system',uniq('标准体系'));let domains=uniq('专业分类');if(state.system!=='全部')domains=[...new Set(all.filter(x=>x['标准体系']===state.system).map(x=>x['专业分类']).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-CN'));if(state.domain!=='全部'&&!domains.includes(state.domain))state.domain='全部';renderOptions('domainOpts','domain',domains);}
function norm(s){return(s||'').toLowerCase().replace(/\s+/g,'');}
function apply(){const q=norm($('q').value);filtered=all.filter(x=>{const text=norm([x['标准号'],x['标准名称'],x['文件名'],x['标准体系'],x['专业分类']].join(' '));return(!q||text.includes(q))&&(state.level==='全部'||x['标准层级']===state.level)&&(state.nature==='全部'||x['标准性质']===state.nature)&&(state.system==='全部'||x['标准体系']===state.system)&&(state.domain==='全部'||x['专业分类']===state.domain);});page=Math.min(page,Math.max(1,Math.ceil(filtered.length/PAGE_SIZE)));renderTable();renderPager();}
function renderTable(){$('count').textContent=`共收录 ${all.length} 项，当前筛选 ${filtered.length} 项`;const body=$('tbody');body.innerHTML='';const start=(page-1)*PAGE_SIZE,rows=filtered.slice(start,start+PAGE_SIZE);if(!rows.length){body.innerHTML='<tr><td colspan="9" class="empty">没有找到符合条件的标准</td></tr>';return;}rows.forEach((x,i)=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${start+i+1}</td><td class="stdno">${x['标准号']||'-'}</td><td class="title">${x['标准名称']}</td><td><span class="badge">${x['标准层级']}</span></td><td>${x['标准性质']}</td><td>${x['标准体系']}</td><td>${x['专业分类']}</td><td>${x['年份']||'-'}</td><td><a class="download-btn" href="${x['下载']||x['链接']}" download>下载文档</a></td>`;body.appendChild(tr);});}
function renderPager(){const pages=Math.ceil(filtered.length/PAGE_SIZE),el=$('pager');el.innerHTML='';if(pages<=1)return;const add=(txt,p,active=false)=>{const b=document.createElement('button');b.textContent=txt;b.className=active?'active':'';b.disabled=p<1||p>pages;b.onclick=()=>{page=p;renderTable();renderPager();window.scrollTo({top:0,behavior:'smooth'});};el.appendChild(b);};add('‹',page-1);const s=Math.max(1,page-2),e=Math.min(pages,page+2);for(let p=s;p<=e;p++)add(p,p,p===page);add('›',page+1);}
function reset(){state.level=state.nature=state.system=state.domain='全部';$('q').value='';page=1;renderAllOptions();apply();}
$('searchBtn').onclick=()=>{page=1;apply();};$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){page=1;apply();}});$('q').addEventListener('input',()=>{page=1;apply();});$('resetBtn').onclick=reset;
fetch('./standards.json').then(r=>{if(!r.ok)throw new Error('数据文件不存在');return r.json();}).then(data=>{all=data;filtered=data;renderAllOptions();apply();}).catch(err=>{$('count').textContent='标准数据加载失败：'+err.message;$('tbody').innerHTML='<tr><td colspan="9" class="empty">请稍后刷新页面。</td></tr>';});
</script>
</body></html>
